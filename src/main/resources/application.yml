spring:
  application:
    name: log_flow

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      url: ${REDIS_URL}

  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    listener:
      simple:
        auto-startup: true

  web:
    resources:
      add-mappings: false

server:
  port: 8080

  tomcat:
    connection-timeout: 5s
    threads:
      max: 200
      min-spare: 20
    accept-count: 100

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:5}
  burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:10}

ingestion-rate-limit:
  requests-per-minute: ${INGESTION_RATE_LIMIT_REQUESTS_PER_MINUTE:60}
  burst-capacity: ${INGESTION_RATE_LIMIT_BURST_CAPACITY:60}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

resend:
  api-key: ${RESEND_API_KEY:}

app:
  cors:
    allowed-origins: ${FRONTEND_URLS:}