spring.application.name=log_flow
server.port=8080

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.connection-timeout=5s

spring.datasource.url=jdbc:postgresql://url-to-your-database
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.url=redis://default:your_redis_password@your_redis_host:6379

rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}
rate-limit.burst-capacity=${RATE_LIMIT_BURST_CAPACITY:10}

jwt.secret=secret-key-for-jwt-signing-change-in-production
jwt.expiration-ms=604800000 // 7 days in milliseconds